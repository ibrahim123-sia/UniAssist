<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F8FC" />
    <meta name="description" content="UniAssist — AI-powered assistant for Muhammad Ali Jinnah University students" />
    <title>UniAssist</title>
    <!-- Apply the saved theme before React renders so the page never
         flashes the wrong mode. Day Desk (light) is the default. -->
    <script>
      (function () {
        var t = "light";
        try {
          if (localStorage.getItem("uniassist-theme") === "dark") t = "dark";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#0A0F1E" : "#F7F8FC");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
